<!DOCTYPE html>
<html lang="en" translate="no">

<head>
  <!-- Served by Cloudflare Pages, with status 404, for every address that has
       no file. Without it Pages answers with index.html, whose relative links
       break below the root. So every link here starts with "/". -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found – OpenVolley</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e2001a">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preload" href="/assets/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/landing.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/" aria-label="OpenVolley home">
        <img src="/assets/brand/openvolley-lockup.svg" alt="OpenVolley" width="149" height="32" draggable="false">
      </a>
      <nav class="topnav" aria-label="Sections">
        <a href="/#apps">Apps</a>
        <a class="nav-optional-xs" href="/#download">Download</a>
        <a href="/en/support">Support</a>
        <a class="nav-optional" href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="card hero" aria-labelledby="hero-title">
      <div class="hero-body">
        <p class="eyebrow">Error 404</p>
        <h1 id="hero-title">Page not found</h1>
        <p class="lead">There is no page at this address. The link may be old or mistyped.</p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Home</a>
          <a class="btn btn-ghost" href="/en/support">Support and guides</a>
        </div>
      </div>
      <img class="hero-mark" src="/assets/brand/openvolley-mark.svg" alt="" width="220" height="220" draggable="false">
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <nav class="legal-links" aria-label="Legal"><a href="/en/privacy">Privacy</a> · <a href="/en/imprint">Legal notice</a> · <a href="/en/terms">Terms of use</a> · <a href="/en/open-source">Open source</a></nav>
      <p>OpenVolley · free software under the <a href="https://github.com/Lucanepa/openvolley/blob/main/LICENSE">GPL-3.0</a> · <a href="https://github.com/Lucanepa/openvolley">Source code</a></p>
    </div>
  </footer>
</body>

</html>
